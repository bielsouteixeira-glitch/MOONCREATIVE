name: Testar prévia móvel pública
on:
  push:
    branches: [arena/dba63d3b-mooncreative]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: node scripts/check-public-preview.mjs
